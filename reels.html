<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الأصول والريلز — معمل البرومبتات</title>
  <meta name="description" content="تصفح مجموعة ضخمة من برومبتات وصور الذكاء الاصطناعي بنظام الريلز والإنستغرام، انسخ البرومبت، نزل الصورة، واحفظ المفضلات.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Changa:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav">
    <div class="nav-inner" id="navInner">
      <a href="index.html" class="logo" aria-label="الصفحة الرئيسية">
        <span class="logo-text animated-logo">معمل البرومبت</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="generator.html" class="nav-link">أنشئ برومبت</a>
        <a href="reels.html" class="nav-link is-active">reels pro</a>
        <a href="app.html" class="nav-link">التطبيق 📱</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-outline btn-sm lang-btn" id="langToggleBtn">English</button>
        <a href="index.html" class="btn btn-primary">الرئيسية</a>
      </div>
    </div>
  </header>

  <!-- ============ REELS HERO & FEED ============ -->
  <section class="reels-hero">
    <div style="max-width:800px; margin:0 auto; text-align:center;">
      <span class="chip" style="background:rgba(255,90,60,0.15); color:var(--video); font-weight:700; font-size:13px; padding:6px 16px; border-radius:20px; margin-bottom:12px; display:inline-block;">🔥 متجر الأصول والريلز الاحترافي</span>
      <h1 class="display animated-signature" style="font-size:2.4rem; margin-bottom:10px;">استكشف مئات البرومبتات والصور الجاهزة</h1>
      <p style="color:#94a3b8; font-size:1rem; margin-bottom:20px;">اسكرول وتصفح كأنه إنستغرام أو تيك توك — اضغط نسخ للبرومبت أو تنزيل للصورة مباشرة!</p>
      
      <div style="display:flex; justify-content:center; gap:30px; margin-top:20px;">
        <div class="reels-stat">
          <span class="reels-stat-num" id="reelsTotalCount">250+</span>
          <span class="reels-stat-label">برومبت وصورة</span>
        </div>
        <div class="reels-stat">
          <span class="reels-stat-num">100%</span>
          <span class="reels-stat-label">مجاني بالكامل</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Controls Bar ===== -->
  <div class="reels-controls-bar">
    <div style="max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; gap:12px; width:100%;">
        <input type="text" id="reelsSearchInput" class="field-input" placeholder="🔍 ابحث بالاسم، الفكرة، أو الكلمة المفتاحية (مثال: كلاسيك، شباب، وجه)..." style="flex:1;">
      </div>

      <div class="chips-group" id="reelsCategoryChips" style="margin:0;">
        <button class="chip is-active" data-cat="all">الكل ✨</button>
        <button class="chip" data-cat="بنين">بنين 👦</button>
        <button class="chip" data-cat="بنات">بنات 👧</button>
        <button class="chip" data-cat="شخصية">شخصيات 👤</button>
        <button class="chip" data-cat="كلاسيك">كلاسيك 🚗</button>
      </div>

      <div id="reelsResultsCount" style="font-size:12.5px; color:#94a3b8; font-weight:600;"></div>
    </div>
  </div>

  <!-- ===== Reels Container ===== -->
  <main class="reels-feed-container" id="reelsFeedContainer">
    <!-- Rendered via JS -->
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
